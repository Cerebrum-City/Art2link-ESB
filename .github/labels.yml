# Labels as code. Synced by .github/workflows/labels-sync.yml
# Keep this list short. Structured data belongs in org-level Issue fields,
# not in labels.

# --- Triage state -----------------------------------------------------------
- name: needs-triage
  color: "ededed"
  description: Not yet reviewed by a maintainer

- name: needs-info
  color: "d4c5f9"
  description: Waiting on the reporter for more detail

- name: needs-repro
  color: "d4c5f9"
  description: Cannot reproduce yet with the information provided

- name: confirmed
  color: "0e8a16"
  description: Reproduced and accepted. Creates an Azure DevOps work item.

- name: in-progress
  color: "1d76db"
  description: Being worked on by engineering

- name: fixed-pending-release
  color: "5319e7"
  description: Fixed in source, not yet shipped

# --- Resolutions ------------------------------------------------------------
- name: resolution/duplicate
  color: "cfd3d7"
  description: Already tracked in another issue

- name: resolution/not-a-bug
  color: "cfd3d7"
  description: Working as designed. Consider converting to a Discussion.

- name: resolution/wontfix
  color: "cfd3d7"
  description: Acknowledged but will not be addressed

- name: resolution/stale
  color: "cfd3d7"
  description: Closed for inactivity. Comment to reopen.

