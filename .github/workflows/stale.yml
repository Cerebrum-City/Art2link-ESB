name: Close stale needs-info issues

# Only touches issues waiting on the reporter. Confirmed bugs are never
# auto-closed — nothing is more corrosive to a public tracker than a bot
# closing a real, reproduced bug.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: "needs-info"
          days-before-stale: 14
          days-before-close: 14
          stale-issue-label: "resolution/stale"
          stale-issue-message: >
            This issue has been waiting on additional information for 14 days.
            If you can still reproduce it, please add the requested detail and
            we will pick it back up. Otherwise it will close in another 14 days.
          close-issue-message: >
            Closing for inactivity. This is not a judgement on the report —
            comment with the missing detail any time and it will reopen.
          exempt-issue-labels: "confirmed,in-progress,fixed-pending-release,regression"
          days-before-pr-stale: -1
          days-before-pr-close: -1
