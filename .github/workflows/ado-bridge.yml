name: Create Azure DevOps work item

# Fires when a maintainer applies the "confirmed" label to an issue.
# Creates a Bug work item in Azure DevOps, links it back to the GitHub issue,
# and records the work item ID in the Actions run summary (not publicly on the
# issue, so internal IDs stay internal).

on:
  issues:
    types: [labeled]

permissions:
  issues: read

jobs:
  create-work-item:
    if: github.event.label.name == 'confirmed'
    runs-on: ubuntu-latest
    steps:
      - name: Create work item in Azure DevOps
        env:
          ADO_ORG: ${{ secrets.ADO_ORG }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_AREA_PATH: ${{ vars.ADO_AREA_PATH }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg title "[GH-${ISSUE_NUMBER}] ${ISSUE_TITLE}" \
            --arg body  "${ISSUE_BODY}" \
            --arg url   "${ISSUE_URL}" \
            --arg author "${ISSUE_AUTHOR}" \
            --arg area  "${ADO_AREA_PATH}" \
            '
            [
              { op: "add", path: "/fields/System.Title", value: $title },
              { op: "add", path: "/fields/System.Description",
                value: ("<p>Reported by <b>" + $author + "</b> at <a href=\"" + $url + "\">" + $url + "</a></p><pre>" + $body + "</pre>") },
              { op: "add", path: "/fields/System.Tags", value: "github;community-report" },
              { op: "add", path: "/relations/-", value: {
                  rel: "Hyperlink",
                  url: $url,
                  attributes: { comment: "GitHub issue" }
                }
              }
            ]
            + (if $area == "" then [] else
                [{ op: "add", path: "/fields/System.AreaPath", value: $area }]
               end)
            ')

          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -u ":${ADO_PAT}" \
            -H "Content-Type: application/json-patch+json" \
            -d "${PAYLOAD}" \
            "https://dev.azure.com/${ADO_ORG}/${ADO_PROJECT}/_apis/wit/workitems/\$Bug?api-version=7.1")

          WORK_ITEM_ID=$(echo "${RESPONSE}" | jq -r '.id')
          WORK_ITEM_URL="https://dev.azure.com/${ADO_ORG}/${ADO_PROJECT}/_workitems/edit/${WORK_ITEM_ID}"

          {
            echo "### Azure DevOps work item created"
            echo ""
            echo "- GitHub issue: [#${ISSUE_NUMBER}](${ISSUE_URL})"
            echo "- Work item: [${WORK_ITEM_ID}](${WORK_ITEM_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"
