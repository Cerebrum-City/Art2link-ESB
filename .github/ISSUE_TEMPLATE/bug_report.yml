name: Bug report
description: Report a defect in the product
title: "[Bug]: "
type: Bug
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. A few structured details up
        front save a round trip and get this in front of an engineer faster.

        **Do not post credentials, connection strings, customer data, or
        security vulnerabilities here.** This is a public tracker. For security
        issues, use private reporting (see SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and Discussions for this problem
          required: true
        - label: I checked the Known Issues page in the documentation
          required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected area
      description: Which part of Art2link is misbehaving?
      options:
        - Console / Designer
        - Schemas
        - Maps (XSLT)
        - Itineraries / Orchestration
        - Pipelines
        - Adapters & Protocols (AS2, SFTP, REST, SOAP, MQ)
        - EDI (X12 / EDIFACT)
        - HL7 / FHIR
        - Tracking & Monitoring
        - Runtime / Messaging
        - Deployment & Configuration
        - Migration AI
        - Security & Access
        - Documentation
        - Other / Not sure
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging / UAT
        - Local / Development
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / build
      description: Shown in the Console under Help > About.
      placeholder: "e.g. 2.4.1 (build 8812)"
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: How often does it happen?
      options:
        - Always
        - Intermittently
        - Happened once
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps someone else can follow on a clean install.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack traces, or error messages
      description: Paste relevant output. Redact anything sensitive first.
      render: shell
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Environment details
      description: >
        Azure region, deployment edition, browser, and the source or target
        system involved. Do not include tenant IDs, resource names, endpoints,
        or trading-partner identifiers.
      placeholder: "e.g. East US 2, Starter edition, Chrome 128, SAP ECC source"
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Workaround found
      description: If you found a way around it, describing it here helps others.
    validations:
      required: false
